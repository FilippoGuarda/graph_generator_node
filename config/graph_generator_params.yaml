graph_generator_node:
  ros__parameters:
    # Input topic from GlobalCostmapFusion
    shared_costmap_topic: "/robot1/global_costmap/costmap"
    
    # TF frame ID
    global_frame: "map"
    
    # GRID-FAST preprocessing parameters
    # Minimum obstacle size in cells to preserve (removes noise)
    obstacle_size_threshold: 2
    skeleton_threshold: 10
    
    # Graph building parameters
    # Maximum BFS propagation budget for each source
    max_steps: 10
    
    # Enable entrance node creation when a source's budget is exhausted
    # If false, budget is silently reset without creating nodes
    find_entrances: true
    cluster_nodes: true
    prune: true
    stagger_points: false
    cluster_radius: 3.0
    
    robot_radius: 20.0
    max_entrance_distance: 10